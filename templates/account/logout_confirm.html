{% load static %}

<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Cerrar sesión | By Colección</title>

    <link
        rel="icon"
        href="{% static 'hotel/img/icons/favicon.ico' %}"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'hotel/css/auth.css' %}"
    >
</head>

<body>

<main class="auth-page">

    <section class="logout-card">

        <div class="logout-symbol">
            BY
        </div>

        <span class="auth-eyebrow">
            Área privada
        </span>

        <h1>¿Quieres cerrar la sesión?</h1>

        <p>
            Saldrás del panel de gestión de By Colección.
            Para volver a entrar necesitarás identificarte de nuevo.
        </p>

        <div class="logout-actions">

            <a
                href="{% url 'hotel:dashboard' %}"
                class="auth-secondary-button"
            >
                Volver al panel
            </a>

            <form
                method="post"
                action="{% url 'logout' %}"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="auth-logout-button"
                >
                    Cerrar sesión
                </button>

            </form>

        </div>

    </section>

</main>

</body>
</html>
